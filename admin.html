<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çetin Design Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><div><b>ÇETİN DESIGN</b><small>ADMIN</small></div><a href="/" target="_blank">Siteyi Aç ↗</a></header><main><section class="hero"><p>YÖNETİM PANELİ</p><h1>Koleksiyonu buradan yönet.</h1><span>Ürün, kategori, fiyat, beden/ölçü, renk, görsel ve görünürlük değişiklikleri canlı siteye yansır.</span></section><section class="toolbar"><button id="newProduct">+ Yeni Ürün</button><button id="reload">Yenile</button><select id="categoryFilter"><option value="">Tüm kategoriler</option><option value="tshirt">Tişört</option><option value="sweat">Sweat</option><option value="shorts">Şort</option><option value="socks">Çorap</option><option value="glasses">Gözlük</option><option value="cap">Şapka / Cap</option><option value="beanie">Bere</option></select><input id="searchProducts" placeholder="Ürün ara..."><span id="status"></span></section><section id="products" class="grid"></section></main><dialog id="editor"><form method="dialog" id="productForm"><h2 id="formTitle">Ürün</h2><input type="hidden" name="id"><label>Ürün adı<input name="name" required placeholder="Signature Oversize Tee"></label><label>Slug / bağlantı adı<input name="slug" required placeholder="signature-oversize-tee"></label><label>Açıklama<textarea name="description" rows="4" placeholder="Kumaş, kalıp, detaylar..."></textarea></label><div class="row"><label>Fiyat (TL)<input name="price" type="number" min="0" step="1"></label><label>Sıralama<input name="sort_order" type="number" value="0"></label></div><label>Kategori<select name="category"><option value="tshirt">Tişört</option><option value="sweat">Sweat</option><option value="shorts">Şort</option><option value="socks">Çorap</option><option value="glasses">Gözlük</option><option value="cap">Şapka / Cap</option><option value="beanie">Bere</option></select></label><label>Ürün fotoğrafı<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif"><small id="uploadHelp">JPG, PNG, WEBP, AVIF veya GIF · en fazla 20 MB</small></label><div id="imagePreviewWrap" style="display:none"><img id="imagePreview" alt="Ürün görsel önizleme" style="width:100%;max-height:320px;object-fit:cover;border:1px solid #38322a;background:#111"></div><label>Görsel yolu<input name="image" placeholder="Fotoğraf yükleyince otomatik dolar"><small>İstersen mevcut bir görsel yolunu da elle kullanabilirsin.</small></label><div class="row"><label>Beden / Ölçü seçenekleri<input name="sizes" placeholder="S,M,L,XL veya Standart"></label><label>Renkler<input name="colors" placeholder="Siyah,Ekru"></label></div><div class="checks"><label><input type="checkbox" name="active" checked> Sitede göster</label><label><input type="checkbox" name="featured"> Ana sayfada öne çıkar</label></div><div class="actions"><button value="cancel">İptal</button><button type="button" id="saveBtn" class="save">Kaydet</button></div></form></dialog><script src="admin.js"></script></body></html>
