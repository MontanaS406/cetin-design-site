<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çetin Design Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><div><b>ÇETİN DESIGN</b><small>ADMIN</small></div><a href="/" target="_blank">Siteyi Aç ↗</a></header><main><section class="hero"><p>YÖNETİM PANELİ</p><h1>Ürünleri buradan yönet.</h1><span>Kaydettiğin değişiklikler canlı sitede API üzerinden görünür.</span></section><section class="toolbar"><button id="newProduct">+ Yeni Ürün</button><button id="reload">Yenile</button><span id="status"></span></section><section id="products" class="grid"></section></main><dialog id="editor"><form method="dialog" id="productForm"><h2 id="formTitle">Ürün</h2><input type="hidden" name="id"><label>Slug<input name="slug" required placeholder="winged-lion-tee"></label><label>Ürün adı<input name="name" required></label><label>Açıklama<textarea name="description" rows="4"></textarea></label><div class="row"><label>Fiyat (TL)<input name="price" type="number" min="0" step="1"></label><label>Sıra<input name="sort_order" type="number" value="0"></label></div><label>Görsel URL / dosya yolu<input name="image" placeholder="product-wing.webp"></label><label>Kategori<select name="category"><option value="tshirt">Tişört</option><option value="sweat">Sweat</option><option value="other">Diğer</option></select></label><label>Bedenler<input name="sizes" placeholder="S,M,L,XL"></label><label>Renkler<input name="colors" placeholder="Siyah,Ekru"></label><div class="checks"><label><input type="checkbox" name="active" checked> Aktif</label><label><input type="checkbox" name="featured"> Öne çıkar</label></div><div class="actions"><button value="cancel">İptal</button><button type="button" id="saveBtn" class="save">Kaydet</button></div></form></dialog><script src="admin.js"></script></body></html>
